name: deploy

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-msvc-binaries

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-binaries

          - os: macos-latest
            target: ''
            artifact: macos-binaries

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        if: matrix.target == ''
        run: cargo build --release

      - name: Build (cross-compile)
        if: matrix.target != ''
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/release/json-minimal-tests.exe `
            -DestinationPath json-minimal-tests-windows-msvc.zip

      - name: Package Linux binary
        if: runner.os == 'Linux'
        run: |
          cd target/${{ matrix.target }}/release
          strip json-minimal-tests
          tar -czf "$GITHUB_WORKSPACE/json-minimal-tests-linux.tar.gz" \
            json-minimal-tests

      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: |
          strip target/release/json-minimal-tests
          cd target/release
          zip "$GITHUB_WORKSPACE/json-minimal-tests-macos.zip" \
            json-minimal-tests

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            json-minimal-tests-windows-msvc.zip
            json-minimal-tests-linux.tar.gz
            json-minimal-tests-macos.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '*-binaries'
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
